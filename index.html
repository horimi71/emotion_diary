<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 공감 다이어리</title>
<style>
  :root {
    --bg: #faf5ec;
    --paper: #fffdf8;
    --ink: #4a3f35;
    --ink-soft: #7a6f61;
    --accent: #d98c6b;
    --accent-soft: #f3ddc9;
    --border: #ece2d2;
    --shadow: 0 8px 24px rgba(120, 96, 62, 0.12);
    --radius: 20px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: linear-gradient(180deg, #faf5ec 0%, #f6efe1 100%);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", -apple-system, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
  }

  header.app-header {
    text-align: center;
    margin-bottom: 28px;
  }

  header.app-header h1 {
    font-size: 1.8rem;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }

  header.app-header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
  }

  .entry-form {
    margin-bottom: 24px;
  }

  .entry-form label {
    display: block;
    font-weight: 600;
    margin-bottom: 10px;
    font-size: 0.95rem;
  }

  .entry-form .input-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .entry-form input[type="text"] {
    flex: 1 1 240px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #fffefb;
    color: var(--ink);
    font-size: 1rem;
    font-family: inherit;
    min-width: 0;
  }

  .entry-form input[type="text"]:focus {
    outline: 3px solid var(--accent-soft);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  .entry-form button {
    flex: 0 0 auto;
    padding: 14px 22px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .entry-form button:hover {
    background: #c97b58;
  }

  .entry-form button:active {
    transform: translateY(1px);
  }

  .entry-form button:focus-visible,
  .entry-form input[type="text"]:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .form-hint {
    margin: 8px 2px 0;
    font-size: 0.82rem;
    color: var(--ink-soft);
    min-height: 1.2em;
  }

  .photo-label {
    display: block;
    margin: 14px 0 8px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-weight: 600;
  }

  input[type="file"] {
    font-size: 0.85rem;
    color: var(--ink-soft);
    max-width: 100%;
  }

  .photo-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
  }

  .photo-row:empty {
    display: none;
    margin-top: 0;
  }

  .photo-row img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--accent-soft);
  }

  .photo-preview {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .photo-preview img {
    width: 72px;
    height: 72px;
    flex: 0 0 auto;
    object-fit: cover;
  }

  .photo-block {
    margin-top: 12px;
  }

  .photo-block img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  .photo-limit-msg {
    margin: 0;
    padding: 16px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
    background: var(--accent-soft);
    border-radius: 12px;
  }

  .photo-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .reaction-btn,
  .download-btn {
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
  }

  .reaction-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .entry-account {
    margin: 0 0 10px;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 14px 4px;
    flex-wrap: wrap;
  }

  .filter-row label {
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .filter-row select {
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.85rem;
  }

  .result-card {
    margin-bottom: 28px;
    display: none;
  }

  .result-card.visible {
    display: block;
  }

  .result-card h2 {
    margin: 0 0 14px;
    font-size: 1rem;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .emotion-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 14px;
  }

  .emotion-badge .emoji {
    font-size: 1.2rem;
  }

  .empathy-message {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.7;
  }

  [data-emotion="joy"]      { background: #fdead0; color: #8a5a00; }
  [data-emotion="sad"]      { background: #dde8f5; color: #2d5a8c; }
  [data-emotion="angry"]    { background: #f9dcd9; color: #9c3b3b; }
  [data-emotion="anxious"]  { background: #e6ddf3; color: #5b3d8c; }
  [data-emotion="tired"]    { background: #e6e1d8; color: #5c5347; }
  [data-emotion="calm"]     { background: #dcecdf; color: #366b47; }
  [data-emotion="grateful"] { background: #fdeccf; color: #8a6300; }
  [data-emotion="lonely"]   { background: #e2e4ef; color: #3f4a7a; }
  [data-emotion="neutral"]  { background: #ece6db; color: #5c5347; }
  [data-emotion="crisis"]   { background: #f6d9d9; color: #a13d3d; }

  .result-card.crisis {
    border-color: #e3b7b7;
  }

  section.diary-log h2 {
    font-size: 1.05rem;
    margin: 0 0 14px 4px;
    color: var(--ink-soft);
  }

  .diary-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .diary-item {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }

  .diary-item .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .diary-item time {
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  .diary-item .emotion-badge {
    margin-bottom: 0;
    padding: 5px 12px;
    font-size: 0.85rem;
  }

  .diary-item .diary-text {
    margin: 0 0 10px;
    font-size: 1rem;
    word-break: break-word;
  }

  .diary-item .diary-response {
    margin: 0;
    font-size: 0.92rem;
    color: var(--ink-soft);
    border-top: 1px dashed var(--border);
    padding-top: 10px;
    line-height: 1.6;
  }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    padding: 24px 16px;
    font-size: 0.92rem;
  }

  .section-title {
    margin: 0 0 6px;
    font-size: 1.05rem;
  }

  .auth-desc {
    margin: 0 0 16px;
    color: var(--ink-soft);
    font-size: 0.88rem;
    line-height: 1.6;
  }

  .auth-card {
    margin-bottom: 24px;
  }

  .app-content {
    display: none;
  }

  .app-content.visible {
    display: block;
  }

  .user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
    padding: 0 4px;
  }

  .user-bar span {
    font-size: 0.85rem;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .user-bar button {
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
  }

  .user-bar button:hover {
    background: var(--accent-soft);
    color: var(--ink);
  }

  @media (max-width: 420px) {
    body {
      padding: 20px 10px 48px;
    }

    .card {
      padding: 18px;
    }

    .entry-form .input-row {
      flex-direction: column;
    }

    .entry-form button {
      width: 100%;
    }

    header.app-header h1 {
      font-size: 1.5rem;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <h1>AI 공감 다이어리</h1>
      <p>오늘 하루를 한 줄로 적으면, 마음을 함께 들여다봐 드릴게요.</p>
    </header>

    <main>
      <section class="card auth-card" id="auth-card" aria-labelledby="auth-title">
        <h2 id="auth-title" class="section-title">회원 로그인</h2>
        <p class="auth-desc">이메일 주소와 공통 비밀번호를 입력해 주세요. 처음 오신 분은 자동으로 회원가입돼요. 로그인한 회원들은 서로의 기록을 함께 볼 수 있어요.</p>

        <form id="email-form" novalidate>
          <label for="auth-email">이메일 주소</label>
          <div class="input-row">
            <input type="email" id="auth-email" name="auth-email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <label for="auth-password" style="margin-top:14px;">비밀번호</label>
          <div class="input-row">
            <input type="password" id="auth-password" name="auth-password" autocomplete="current-password" required>
            <button type="submit" id="send-code-btn">로그인 / 가입</button>
          </div>
        </form>

        <p class="form-hint" id="auth-hint" role="status" aria-live="polite"></p>
      </section>

      <div id="app-content" class="app-content">
        <div class="user-bar">
          <span id="user-email-label"></span>
          <button type="button" id="sign-out-btn">로그아웃</button>
        </div>

        <section class="card entry-form" aria-labelledby="entry-form-title">
          <h2 id="entry-form-title" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">오늘의 기록 작성</h2>
          <form id="diary-form" novalidate>
            <label for="diary-input">오늘 있었던 일을 한 줄로 적어보세요</label>
            <div class="input-row">
              <input
                type="text"
                id="diary-input"
                name="diary-input"
                placeholder="예: 오늘 오랜만에 친구를 만나서 즐거웠다"
                autocomplete="off"
                maxlength="500"
                required
              >
              <button type="submit" id="submit-entry-btn">기록하기</button>
            </div>
            <label for="diary-photos" class="photo-label">사진 첨부 (최대 5장, 선택)</label>
            <input type="file" id="diary-photos" name="diary-photos" accept="image/*" multiple>
            <div class="photo-row photo-preview" id="photo-preview"></div>
            <p class="form-hint" id="form-hint" role="status" aria-live="polite"></p>
          </form>
        </section>

        <section class="card result-card" id="result-card" aria-live="polite" aria-atomic="true">
          <h2>방금 남긴 마음</h2>
          <div class="photo-row" id="result-photos"></div>
          <span class="emotion-badge" id="result-badge">
            <span class="emoji" id="result-emoji"></span>
            <span id="result-emotion-name"></span>
          </span>
          <p class="empathy-message" id="result-message"></p>
        </section>

        <section class="diary-log" aria-labelledby="diary-log-title">
          <h2 id="diary-log-title">회원들이 함께 남긴 기록</h2>
          <div class="filter-row">
            <label for="account-filter">계정으로 필터</label>
            <select id="account-filter">
              <option value="">전체 회원</option>
            </select>
          </div>
          <p class="form-hint" id="list-hint" role="status" aria-live="polite"></p>
          <ul class="diary-list" id="diary-list"></ul>
          <p class="empty-state" id="empty-state">아직 기록된 하루가 없어요. 오늘의 한 줄을 남겨보세요.</p>
        </section>
      </div>
    </main>
  </div>

  <script>
(function (global) {
  'use strict';

  var MAX_ANALYZE_LENGTH = 3000;

  function stripSpaces(s) {
    return String(s).replace(/\s+/g, '');
  }

  var CRISIS_KEYWORDS = [
    '죽고싶다', '죽고싶어', '죽고파', '죽어버리고싶다',
    '자살하고싶다', '자살할것같다', '자살충동', '자살시도', '자살',
    '자해하고싶다', '자해했다', '자해',
    '사라지고싶다', '사라져버리고싶다', '이세상에서사라지고싶다',
    '살고싶지않다', '살기싫다', '삶을끝내고싶다', '삶을포기하고싶다',
    '목숨을끊고싶다', '목숨을끊고', '뛰어내리고싶다', '존재를끝내고싶다'
  ];

  var INTENSIFIERS = ['너무', '정말', '진짜', '완전', '엄청', '매우', '굉장히', '심하게', '극도로', '너무너무'];

  var EMOTION_KEYWORDS = {
    '기쁨': [
      ['행복', 2], ['기쁘', 2], ['기뻐', 2], ['기뻤', 2],
      ['즐겁', 2], ['즐거워', 2], ['즐거웠', 2],
      ['신나', 2], ['신났', 2],
      ['최고', 2], ['좋', 1],
      ['웃었', 1], ['웃음', 1],
      ['설레', 2], ['설렜', 2],
      ['뿌듯', 2], ['성공', 2], ['합격', 2], ['승진', 2], ['축하', 1],
      ['재밌', 1], ['재미있', 1]
    ],
    '슬픔': [
      ['슬프', 2], ['슬퍼', 2], ['슬펐', 2],
      ['눈물', 2],
      ['울었', 2], ['울어', 1], ['울고싶', 2],
      ['우울', 2], ['속상', 2],
      ['아프', 1], ['아파', 1], ['아팠', 1],
      ['서럽', 2], ['서러워', 2], ['서러웠', 2],
      ['그립', 1], ['그리워', 1], ['그리웠', 1],
      ['아쉽', 1], ['아쉬워', 1], ['아쉬웠', 1],
      ['실망', 2], ['상실감', 2], ['이별', 1],
      ['헤어지', 2], ['헤어졌', 2],
      ['먹먹', 1]
    ],
    '화남': [
      ['화나', 2], ['화났', 2], ['화가나', 2],
      ['짜증', 2],
      ['열받', 2],
      ['빡치', 2], ['빡쳤', 2],
      ['억울', 2],
      ['분하', 2], ['분했', 2],
      ['미치겠', 1],
      ['답답', 1],
      ['싫', 1],
      ['극혐', 2],
      ['불쾌', 1],
      ['어이없', 1]
    ],
    '불안': [
      ['불안', 2], ['걱정', 1], ['초조', 2], ['긴장', 1],
      ['두렵', 2], ['두려워', 2], ['두려웠', 2],
      ['무섭', 2], ['무서워', 2], ['무서웠', 2],
      ['조마조마', 2],
      ['떨리', 1], ['떨렸', 1],
      ['스트레스', 1],
      ['막막', 2], ['압박감', 1]
    ],
    '지침/피로': [
      ['피곤', 2],
      ['지치', 2], ['지쳤', 2],
      ['힘들', 2],
      ['녹초', 2],
      ['무기력', 2],
      ['지겹', 1], ['지겨워', 1], ['지겨웠', 1],
      ['번아웃', 2],
      ['졸리', 1], ['졸렸', 1],
      ['쉬고싶', 1],
      ['탈진', 2],
      ['기운이없', 2], ['기운없', 2]
    ],
    '평온': [
      ['평온', 2], ['편안', 2], ['안정', 1], ['차분', 2],
      ['여유', 1], ['고요', 2], ['잔잔', 2], ['만족', 1],
      ['평화', 2], ['느긋', 1]
    ],
    '감사': [
      ['감사', 2], ['고맙', 2], ['고마워', 2], ['고마웠', 2],
      ['은혜', 1], ['소중', 1], ['감동', 2], ['다행', 1]
    ],
    '외로움': [
      ['외롭', 2], ['외로워', 2], ['외로웠', 2],
      ['쓸쓸', 2], ['혼자', 1], ['고독', 2],
      ['허전', 2], ['공허', 2], ['적적', 1]
    ],
    '중립': [
      ['그냥', 1], ['평범', 1], ['무난', 1], ['별일없', 1],
      ['똑같', 1], ['그저그렇', 1], ['보통', 1]
    ]
  };

  var EMOJI = {
    '기쁨': '😊', '슬픔': '😢', '화남': '😠', '불안': '😰',
    '지침/피로': '😪', '평온': '😌', '감사': '🙏', '외로움': '🥺',
    '중립': '🙂', '위기': '🆘'
  };

  function analyzeEmotion(text) {
    if (typeof text !== 'string' || text.trim().length === 0) {
      return { emotion: '중립', intensity: 'low', emoji: EMOJI['중립'], confidence: 0 };
    }

    var trimmed = text.trim();
    var analysisText = trimmed.length > MAX_ANALYZE_LENGTH ? trimmed.slice(0, MAX_ANALYZE_LENGTH) : trimmed;
    var compact = stripSpaces(analysisText);

    for (var i = 0; i < CRISIS_KEYWORDS.length; i++) {
      if (compact.indexOf(stripSpaces(CRISIS_KEYWORDS[i])) !== -1) {
        return { emotion: '위기', intensity: 'high', emoji: EMOJI['위기'], confidence: 0.95, isCrisis: true };
      }
    }

    var boost = 1;
    if (INTENSIFIERS.some(function (w) { return compact.indexOf(w) !== -1; })) boost *= 1.4;
    if (/[!?]{2,}/.test(analysisText)) boost *= 1.2;

    var scores = {};
    var lastIdx = {};
    Object.keys(EMOTION_KEYWORDS).forEach(function (cat) {
      var s = 0, li = -1;
      EMOTION_KEYWORDS[cat].forEach(function (pair) {
        var word = stripSpaces(pair[0]);
        var weight = pair[1];
        var idx = compact.indexOf(word);
        if (idx !== -1) {
          s += weight;
          if (idx > li) li = idx;
        }
      });
      scores[cat] = s;
      lastIdx[cat] = li;
    });

    if (/ㅠ{2,}|ㅜ{2,}/.test(compact)) scores['슬픔'] = (scores['슬픔'] || 0) + 1;
    if (/ㅋ{2,}|ㅎ{2,}/.test(compact)) scores['기쁨'] = (scores['기쁨'] || 0) + 1;

    Object.keys(scores).forEach(function (cat) {
      if (scores[cat] > 0) scores[cat] *= boost;
    });

    var entries = Object.keys(scores)
      .map(function (cat) { return [cat, scores[cat]]; })
      .filter(function (e) { return e[1] > 0; });

    if (entries.length === 0) {

          img.onload = function () {
            var w = img.naturalWidth, h = img.naturalHeight;
            if (w <= QHD_WIDTH && h <= QHD_HEIGHT) {
              URL.revokeObjectURL(objectUrl);
              resolve(file);
              return;
            }
            var scale = Math.min(QHD_WIDTH / w, QHD_HEIGHT / h);
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(w * scale);
            canvas.height = Math.round(h * scale);
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(objectUrl);
            canvas.toBlob(function (blob) {
              if (!blob) { resolve(file); return; }
              var baseName = (file.name || 'photo').replace(/\.[^.]+$/, '');
              resolve(new File([blob], baseName + '.jpg', { type: 'image/jpeg' }));
            }, 'image/jpeg', 0.85);
          };
          img.onerror = function () { URL.revokeObjectURL(objectUrl); resolve(file); };
          img.src = objectUrl;
        });
      }

      function getTodayUploadCount(userId) {
        var startOfDay = new Date();
        startOfDay.setHours(0, 0, 0, 0);
        return sb.from('diary_photos')
          .select('id', { count: 'exact', head: true })
          .eq('user_id', userId)
          .gte('created_at', startOfDay.toISOString())
          .then(function (res) {
            if (res.error) throw res.error;
            return res.count || 0;
          });
      }

      function uploadPhotosForEntry(files, entryId, userId) {
        var uploads = files.map(function (file, idx) {
          var path = userId + '/' + entryId + '/' + idx + '-' + Math.random().toString(36).slice(2) + '.jpg';
          return sb.storage.from('diary-photos').upload(path, file).then(function (res) {
            if (res.error) throw res.error;
            var publicUrl = sb.storage.from('diary-photos').getPublicUrl(path).data.publicUrl;
            return sb.from('diary_photos')
              .insert([{ entry_id: entryId, user_id: userId, url: publicUrl }])
              .select()
              .then(function (r) {
                if (r.error) throw r.error;
                return r.data[0];
              });
          });
        });
        return Promise.all(uploads);
      }

      var reactionsByPhoto = {};
      var viewsByPhoto = {};
      var viewDecision = {};
      var downloadsByPhoto = {};

      function decideView(photo) {
        if (viewDecision[photo.id]) return viewDecision[photo.id];
        var current = viewsByPhoto[photo.id] || 0;
        if (current < 2) {
          viewDecision[photo.id] = 'show';
          viewsByPhoto[photo.id] = current + 1;
          sb.from('photo_views')
            .upsert({ photo_id: photo.id, user_id: currentUser.id, view_count: current + 1 }, { onConflict: 'photo_id,user_id' })
            .then(function (res) { if (res.error) console.error(res.error); });
        } else {
          viewDecision[photo.id] = 'blocked';
        }
        return viewDecision[photo.id];
      }

      function toggleReaction(photoId, type) {
        var current = reactionsByPhoto[photoId] || { like: 0, dislike: 0, mine: null };
        var newReaction = current.mine === type ? null : type;
        var op = newReaction
          ? sb.from('photo_reactions').upsert({ photo_id: photoId, user_id: currentUser.id, reaction: newReaction }, { onConflict: 'photo_id,user_id' })
          : sb.from('photo_reactions').delete().eq('photo_id', photoId).eq('user_id', currentUser.id);

        op.then(function (res) {
          if (res.error) {
            alert('처리 중 오류가 발생했어요: ' + res.error.message);
            return;
          }
          if (current.mine) current[current.mine] = Math.max(0, current[current.mine] - 1);
          if (newReaction) current[newReaction] = (current[newReaction] || 0) + 1;
          current.mine = newReaction;
          reactionsByPhoto[photoId] = current;
          renderList();
        });
      }

      function handleDownload(photoId, url) {
        if (downloadsByPhoto[photoId]) {
          alert('이미 다운로드 하였습니다, 2번째 다운로드는 용량관계로 제한됩니다');
          return;
        }
        sb.from('photo_downloads')
          .insert([{ photo_id: photoId, user_id: currentUser.id }])
          .then(function (res) {
            if (res.error) {
              downloadsByPhoto[photoId] = true;
              alert('이미 다운로드 하였습니다, 2번째 다운로드는 용량관계로 제한됩니다');
              return;
            }
            downloadsByPhoto[photoId] = true;
            return fetch(url)
              .then(function (r) { return r.blob(); })
              .then(function (blob) {
                var blobUrl = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = blobUrl;
                a.download = 'diary-photo-' + photoId + '.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
              })
              .catch(function (err) {
                alert('다운로드 중 오류가 발생했어요: ' + err.message);
              });
          });
      }

      function buildPhotoBlock(photo) {
        var wrap = document.createElement('div');
        wrap.className = 'photo-block';

        if (!photo.id) {
          var legacyImg = document.createElement('img');
          legacyImg.src = photo.url;
          legacyImg.alt = '첨부된 사진';
          legacyImg.loading = 'lazy';
          wrap.appendChild(legacyImg);
          return wrap;
        }

        var decision = decideView(photo);
        if (decision === 'blocked') {
          var msg = document.createElement('p');
          msg.className = 'photo-limit-msg';
          msg.textContent = '3번째 조회는 용량관계로 제한됩니다';
          wrap.appendChild(msg);
        } else {
          var img = document.createElement('img');
          img.src = photo.url;
          img.alt = '첨부된 사진';
          img.loading = 'lazy';
          wrap.appendChild(img);
        }

        var actions = document.createElement('div');
        actions.className = 'photo-actions';

        var reaction = reactionsByPhoto[photo.id] || { like: 0, dislike: 0, mine: null };

        var likeBtn = document.createElement('button');
        likeBtn.type = 'button';
        likeBtn.className = 'reaction-btn' + (reaction.mine === 'like' ? ' active' : '');
        likeBtn.textContent = '👍 ' + reaction.like;
        likeBtn.addEventListener('click', function () { toggleReaction(photo.id, 'like'); });

        var dislikeBtn = document.createElement('button');
        dislikeBtn.type = 'button';
        dislikeBtn.className = 'reaction-btn' + (reaction.mine === 'dislike' ? ' active' : '');
        dislikeBtn.textContent = '👎 ' + reaction.dislike;
        dislikeBtn.addEventListener('click', function () { toggleReaction(photo.id, 'dislike'); });

        var downloadBtn = document.createElement('button');
        downloadBtn.type = 'button';
        downloadBtn.className = 'download-btn';
        downloadBtn.textContent = '다운로드';
        downloadBtn.addEventListener('click', function () { handleDownload(photo.id, photo.url); });

        actions.appendChild(likeBtn);
        actions.appendChild(dislikeBtn);
        actions.appendChild(downloadBtn);
        wrap.appendChild(actions);

        return wrap;
      }

      var EMOTION_STYLE_KEY = {
        '기쁨': 'joy',
        '슬픔': 'sad',
        '화남': 'angry',
        '불안': 'anxious',
        '지침/피로': 'tired',
        '평온': 'calm',
        '감사': 'grateful',
        '외로움': 'lonely',
        '중립': 'neutral',
        '위기': 'crisis'
      };

      var entries = [];
      var realtimeChannel = null;
      var accountFilterSelect = document.getElementById('account-filter');

      function loadReactionsAndUserState(photoIds) {
        reactionsByPhoto = {};
        viewsByPhoto = {};
        viewDecision = {};
        downloadsByPhoto = {};
        if (!photoIds.length) return Promise.resolve();
        return Promise.all([
          sb.from('photo_reactions').select('*').in('photo_id', photoIds),
          sb.from('photo_views').select('*').in('photo_id', photoIds),
          sb.from('photo_downloads').select('*').in('photo_id', photoIds)
        ]).then(function (results) {
          (results[0].data || []).forEach(function (r) {
            var bucket = reactionsByPhoto[r.photo_id] || (reactionsByPhoto[r.photo_id] = { like: 0, dislike: 0, mine: null });
            bucket[r.reaction] += 1;
            if (r.user_id === currentUser.id) bucket.mine = r.reaction;
          });
          (results[1].data || []).forEach(function (v) { viewsByPhoto[v.photo_id] = v.view_count; });
          (results[2].data || []).forEach(function (d) { downloadsByPhoto[d.photo_id] = true; });
        });
      }

      function renderAccountFilterOptions() {
        var current = accountFilterSelect.value;
        var emails = [];
        entries.forEach(function (e) {
          if (e.user_email && emails.indexOf(e.user_email) === -1) emails.push(e.user_email);
        });
        emails.sort();
        accountFilterSelect.innerHTML = '';
        var allOpt = document.createElement('option');
        allOpt.value = '';
        allOpt.textContent = '전체 회원';
        accountFilterSelect.appendChild(allOpt);
        emails.forEach(function (email) {
          var opt = document.createElement('option');
          opt.value = email;
          opt.textContent = email;
          accountFilterSelect.appendChild(opt);
        });
        if (emails.indexOf(current) !== -1) accountFilterSelect.value = current;
      }

      accountFilterSelect.addEventListener('change', renderList);

      function loadEntries() {
        listHint.textContent = '기록을 불러오는 중이에요...';
        sb.from(TABLE)
          .select('*')
          .order('created_at', { ascending: false })
          .limit(200)
          .then(function (res) {
            if (res.error) throw res.error;
            entries = res.data || [];
            var entryIds = entries.map(function (e) { return e.id; });
            if (!entryIds.length) {
              return;
            }
            return sb.from('diary_photos')
              .select('*')
              .in('entry_id', entryIds)
              .order('created_at', { ascending: true })
              .then(function (pres) {
                if (pres.error) throw pres.error;
                var photosByEntry = {};
                (pres.data || []).forEach(function (p) {
                  (photosByEntry[p.entry_id] = photosByEntry[p.entry_id] || []).push(p);
                });
                var allPhotoIds = [];
                entries.forEach(function (e) {
                  e.photos = photosByEntry[e.id] || (e.photo_urls || []).map(function (u) { return { id: null, url: u }; });
                  e.photos.forEach(function (p) { if (p.id) allPhotoIds.push(p.id); });
                });
                return loadReactionsAndUserState(allPhotoIds);
              });
          })
          .then(function () {
            listHint.textContent = '';
            renderAccountFilterOptions();
            renderList();
          })
          .catch(function (err) {
            listHint.textContent = '기록을 불러오지 못했어요: ' + err.message;
          });
      }

      function subscribeRealtime() {
        if (realtimeChannel) {
          sb.removeChannel(realtimeChannel);
        }
        realtimeChannel = sb
          .channel('diary_entries_changes')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: TABLE }, function (payload) {
            var incoming = payload.new;
            var alreadyExists = entries.some(function (e) { return e.id === incoming.id; });
            if (alreadyExists) return;
            incoming.photos = [];
            entries.unshift(incoming);
            renderAccountFilterOptions();
            renderList();
          })
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'diary_photos' }, function (payload) {
            var photo = payload.new;
            var owner = entries.find(function (e) { return e.id === photo.entry_id; });
            if (!owner) return;
            owner.photos = owner.photos || [];
            if (owner.photos.some(function (p) { return p.id === photo.id; })) return;
            owner.photos.push(photo);
            renderList();
          })
          .subscribe();
      }

      function formatTimestamp(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleString('ko-KR', {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      function buildBadge(emotion, emoji) {
        var styleKey = EMOTION_STYLE_KEY[emotion] || 'neutral';
        var wrap = document.createElement('span');
        wrap.className = 'emotion-badge';
        wrap.setAttribute('data-emotion', styleKey);

        var emojiSpan = document.createElement('span');
        emojiSpan.className = 'emoji';
        emojiSpan.textContent = emoji;
        emojiSpan.setAttribute('aria-hidden', 'true');

        var nameSpan = document.createElement('span');
        nameSpan.textContent = emotion;

        wrap.appendChild(emojiSpan);
        wrap.appendChild(nameSpan);
        return wrap;
      }

      function renderList() {
        diaryList.innerHTML = '';

        var filterValue = accountFilterSelect.value;
        var filtered = filterValue
          ? entries.filter(function (e) { return e.user_email === filterValue; })
          : entries;

        if (filtered.length === 0) {
          emptyState.style.display = 'block';
          return;
        }
        emptyState.style.display = 'none';

        filtered.forEach(function (entry) {
          var li = document.createElement('li');
          li.className = 'diary-item';

          var meta = document.createElement('div');
          meta.className = 'meta';

          var time = document.createElement('time');
          time.textContent = formatTimestamp(entry.created_at);

          meta.appendChild(time);
          meta.appendChild(buildBadge(entry.emotion, entry.emoji));

          var account = document.createElement('p');
          account.className = 'entry-account';
          account.textContent = entry.user_email || '알 수 없는 계정';

          var text = document.createElement('p');
          text.className = 'diary-text';
          text.textContent = entry.text;

          var response = document.createElement('p');
          response.className = 'diary-response';
          response.textContent = entry.message;

          li.appendChild(meta);
          li.appendChild(account);
          (entry.photos || []).forEach(function (photo) {
            li.appendChild(buildPhotoBlock(photo));
          });
          li.appendChild(text);
          li.appendChild(response);
          diaryList.appendChild(li);
        });
      }

      function showResult(entry) {
        var styleKey = EMOTION_STYLE_KEY[entry.emotion] || 'neutral';
        resultBadge.setAttribute('data-emotion', styleKey);
        resultEmoji.textContent = entry.emoji;
        resultEmotionName.textContent = entry.emotion;
        resultMessage.textContent = entry.message;
        resultPhotos.innerHTML = '';
        (entry.photos || []).forEach(function (photo) {
          var img = document.createElement('img');
          img.src = photo.url;
          img.alt = '첨부된 사진';
          resultPhotos.appendChild(img);
        });
        resultCard.classList.add('visible');
        resultCard.classList.toggle('crisis', styleKey === 'crisis');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = input.value.trim();

        if (!text) {
          hint.textContent = '내용을 입력한 뒤 기록해 주세요.';
          input.focus();
          return;
        }

        if (!currentUser) {
          hint.textContent = '로그인 후 기록할 수 있어요.';
          return;
        }

        hint.textContent = '';

        var emotionResult = analyzeEmotion(text);
        var message = generateEmpathyResponse(emotionResult, text);

        var submitBtn = document.getElementById('submit-entry-btn');
        submitBtn.disabled = true;

        var photoFiles = Array.prototype.slice.call(photoInput.files).slice(0, MAX_PHOTOS);

        getTodayUploadCount(currentUser.id)
          .then(function (todayCount) {
            var remaining = Math.max(0, DAILY_PHOTO_LIMIT - todayCount);
            if (photoFiles.length > remaining) {
              if (remaining === 0) {
                hint.textContent = '오늘 사진 업로드 한도(' + DAILY_PHOTO_LIMIT + '장)를 모두 사용했어요. 내일 다시 시도해 주세요.';
              } else {
                hint.textContent = '오늘 남은 업로드 가능 장수는 ' + remaining + '장이에요. 앞의 ' + remaining + '장만 업로드돼요.';
              }
              photoFiles = photoFiles.slice(0, remaining);
            }
            if (photoFiles.length) {
              hint.textContent = (hint.textContent ? hint.textContent + ' ' : '') + '사진을 준비하는 중이에요...';
            }
            return Promise.all(photoFiles.map(resizeIfNeeded));
          })
          .then(function (resizedFiles) {
            return sb.from(TABLE)
              .insert([{
                user_id: currentUser.id,
                user_email: currentUser.email,
                text: text,
                emotion: emotionResult.emotion,
                intensity: emotionResult.intensity,
                emoji: emotionResult.emoji,
                message: message
              }])
              .select()
              .then(function (res) {
                if (res.error) throw res.error;
                var entry = res.data[0];
                if (!resizedFiles.length) {
                  entry.photos = [];
                  return entry;
                }
                return uploadPhotosForEntry(resizedFiles, entry.id, currentUser.id).then(function (photos) {
                  entry.photos = photos;
                  return entry;
                });
              });
          })
          .then(function (entry) {
            submitBtn.disabled = false;
            entries.unshift(entry);
            renderAccountFilterOptions();
            renderList();
            showResult(entry);
            hint.textContent = '';
            input.value = '';
            photoInput.value = '';
            clearPhotoPreview();
            input.focus();
          })
          .catch(function (err) {
            submitBtn.disabled = false;
            hint.textContent = '기록 중 오류가 발생했어요: ' + err.message;
          });
      });

      showLoggedOut();
    })();
  </script>
</body>
</html>
